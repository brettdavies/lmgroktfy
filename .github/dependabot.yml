# Dependabot configuration.
#
# Two ecosystems: npm for the Bun/TypeScript toolchain, github-actions for
# workflow actions. Both scan weekly on Monday mornings with a 7-day cooldown
# so a just-published version has to survive a week before Dependabot proposes
# it. Minor + patch updates group into one PR per week per group.
#
# The wildcard `ignore` rule suppresses every major-version bump: no PR ever
# proposes a breaking-version jump. Security updates are a separate path and
# still land regardless, so a CVE fix that requires a major is not blocked.
# Bump majors deliberately, by hand.
#
# The Playwright family (@playwright/*, playwright, playwright-core) is
# exact-pinned to the version dotfiles provisions into
# $PLAYWRIGHT_BROWSERS_PATH, so bumping it is a dotfiles job, not a per-repo
# one: a client newer than the provisioned browsers fails e2e locally. Those
# entries carry no `update-types`, which suppresses every version update rather
# than majors alone, since an exact pin has no "in range" update Dependabot
# would otherwise leave alone.
#
# `dev` is the default branch, so Dependabot reads this file from `dev` and
# opens every PR against it with no `target-branch` set. A block that names a
# target branch, even the default one, is detached from security updates, so
# the `npm-security-minor-patch` group (`applies-to: security-updates`) sits on
# the same npm block as the version group: advisory fixes batch minor and patch
# bumps per run, and a fix that needs a major stays its own PR. Cooldown and
# the majors ignore do not apply to security updates. This file is mirrored
# onto `main` so both branches carry the same config (`scripts/release/drift.sh`
# checks `.github/` parity).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    cooldown:
      default-days: 7
    # One slot per version-update group below; security PRs are not counted.
    open-pull-requests-limit: 2
    reviewers:
      - brettdavies
    labels:
      - dependencies
      - javascript
    groups:
      # Keep the Astro / Cloudflare adapter / wrangler / Vite stack moving as
      # one PR so no single package drifts out of the locked, mutually
      # compatible set. Listed first: Dependabot assigns a dependency to the
      # first matching group in file order.
      astro-cloudflare:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - '@cloudflare/*'
          - 'wrangler'
          - 'vite'
          - '@tailwindcss/*'
          - 'tailwindcss'
          - 'daisyui'
        update-types:
          - minor
          - patch
      npm-minor-patch:
        update-types:
          - minor
          - patch
      npm-security-minor-patch:
        applies-to: security-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@playwright/*'
      - dependency-name: 'playwright'
      - dependency-name: 'playwright-core'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    reviewers:
      - brettdavies
    labels:
      - dependencies
      - github-actions
    groups:
      # `patterns` rather than `update-types`: a SHA pin's SemVer level comes
      # from a trailing comment, and an unclassifiable action would otherwise
      # fall out of the group and open alone.
      actions-minor-patch:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
