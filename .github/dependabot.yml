# Dependabot configuration.
#
# Two ecosystems: bun for the Bun/TypeScript toolchain, github-actions for
# workflow actions. The `bun` ecosystem regenerates bun.lock inside each update
# PR; the `npm` ecosystem refuses a project that carries bun.lock. Both scan
# weekly on Monday mornings with a 7-day cooldown so a just-published version
# has to survive a week before Dependabot proposes it. Minor + patch updates
# group into one PR per week per group.
#
# The wildcard `ignore` rule suppresses every major-version bump: no PR ever
# proposes a breaking-version jump. Bump majors deliberately, by hand.
#
# Dependabot opens no security updates for Bun, and its alerts cover only the
# direct dependencies in package.json: the dependency graph does not read
# bun.lock. `bun audit` checks the whole lockfile. Fix an advisory by bumping
# the dependency by hand and running `bun install`.
# https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories#bun
#
# The Playwright family (@playwright/*, playwright, playwright-core) is
# exact-pinned to the version dotfiles provisions into
# $PLAYWRIGHT_BROWSERS_PATH, so bumping it is a dotfiles job, not a per-repo
# one: a client newer than the provisioned browsers fails e2e locally. Those
# entries carry no `update-types`, which suppresses every version update rather
# than majors alone, since an exact pin has no "in range" update Dependabot
# would otherwise leave alone.
#
# `dev` is the default branch, so Dependabot reads this file from `dev` and
# opens every PR against it with no `target-branch` set. This file is mirrored
# onto `main` so both branches carry the same config (`scripts/release/drift.sh`
# checks `.github/` parity).
version: 2
updates:
  - package-ecosystem: bun
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    cooldown:
      default-days: 7
    # One slot per group below.
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - javascript
    groups:
      # Keep the Astro / Cloudflare adapter / wrangler / Vite stack moving as
      # one PR so no single package drifts out of the locked, mutually
      # compatible set. Listed first: Dependabot assigns a dependency to the
      # first matching group in file order.
      astro-cloudflare:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - '@cloudflare/*'
          - 'wrangler'
          - 'vite'
          - '@tailwindcss/*'
          - 'tailwindcss'
          - 'daisyui'
        update-types:
          - minor
          - patch
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@playwright/*'
      - dependency-name: 'playwright'
      - dependency-name: 'playwright-core'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      # `patterns` rather than `update-types`: a SHA pin's SemVer level comes
      # from a trailing comment, and an unclassifiable action would otherwise
      # fall out of the group and open alone.
      actions-minor-patch:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
