name: CI

# No push trigger: this is a squash-merge repo, so the merge commit's tree
# equals the PR head this workflow already verified. A push trigger on
# dev/main would re-run identical checks for zero new signal.
on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          # Browsers are installed explicitly below; skip the install-time fetch.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:all

      - name: Install Playwright browser
        run: bunx --cwd apps/web playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e
