name: Canary

# Nightly production health check. Silent when it passes; a failure turns the
# run red and GitHub sends its native failure notification. Scheduled workflows
# run from the default branch (dev).
on:
  schedule:
    # 07:07 UTC is ~02:07 America/Chicago; the random start-delay below spreads
    # the actual run across the 02:00-03:00 window so it is not a fixed time.
    - cron: '7 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fuzz the start time across the 2-3am window (up to ~45 min). Skipped on a
      # manual workflow_dispatch so an on-demand run is immediate.
      - name: Fuzz start time
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 2700 ))

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run build:shared

      - name: Canary
        env:
          CANARY_XAI_API_KEY: ${{ secrets.CANARY_XAI_API_KEY }}
        run: bun run scripts/canary.ts
