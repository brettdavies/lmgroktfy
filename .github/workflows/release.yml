# Single-channel web-app release. The GitHub Release is this pipeline's
# output, not its trigger: an annotated site deploy-stamp tag,
# v<base>.<epoch>-g<sha7> (RELEASES.md § Versioning), pushed to main runs the
# integrity gate, then publishes the Release with notes extracted from
# CHANGELOG.md by version string. There is no build/publish/deploy leg here
# -- lmgroktfy ships no crate, no bottle, no npm package, and Cloudflare
# deploy is a separate, human-gated step (docs/runbooks/
# astro-cloudflare-cutover.md), never triggered by a tag push.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-g[0-9a-f]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)release, e.g. v2.0.1793674334-gc2b6e44. Only needed to retry a failed run without cutting a new tag.'
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  integrity:
    name: Integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Verifies: the tag is a site deploy stamp, its commit is reachable
      # from main, and site-version.sh --verify finds the dev commit its
      # -g<sha7> names and recomputes the same version from it. Everything
      # downstream trusts the tag's version once this passes.
      - name: Verify tag shape, reachability, and site version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-g[0-9a-f]{7}$ ]]; then
            echo "::error::tag '$TAG' is not a site deploy stamp, v<base>.<epoch>-g<sha7>"
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG not found in this checkout"
            exit 1
          fi

          TAG_SHA=$(git rev-parse "$TAG")
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::tag $TAG is not reachable from origin/main"
            exit 1
          fi

          if ! VERIFIED=$(scripts/release/site-version.sh --verify "$TAG" 2>&1); then
            printf '%s\n' "$VERIFIED"
            echo "::error::tag $TAG is not the site version of the dev commit it names (site-version.sh output above)"
            exit 1
          fi

          echo "integrity gate passed: $VERIFIED; reachable from main"

  release:
    name: Create GitHub Release
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Anchors on the tag's version string, never on file position: an
      # `## [Unreleased]` heading above the release section, or a
      # cherry-picked out-of-sequence tag, would make positional extraction
      # (first "## [" block) silently ship the wrong version's notes.
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.integrity.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if (index($0, "[" ver "]") > 0) in_section = 1
            }
            in_section { print }
          ' CHANGELOG.md)

          if [[ -z "$NOTES" ]]; then
            echo "::warning::no CHANGELOG.md section found for [$VERSION]; using a placeholder release body"
            NOTES="Release ${TAG}"
          fi
          printf '%s\n' "$NOTES" >/tmp/release-notes.md

      # gh release edit has no --generate-notes flag (create-only), so both
      # branches use --notes-file uniformly rather than special-casing the
      # fallback text above.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.integrity.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          fi
