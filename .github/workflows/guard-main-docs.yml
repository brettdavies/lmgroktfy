# Caller workflow for the centralized reusable guard-main-docs workflow.
#
# Blocks engineering docs (docs/plans, and the other guarded prefixes the
# reusable hardcodes) from being merged into main. Only needs pull-requests: read.
#
# brettdavies/.github is first-party and owned by the same account as this repo,
# so the reusable-workflow ref stays on @main rather than a SHA pin (the
# supply-chain threat a SHA pin defends against does not apply when source and
# consumer are both under the same control).
name: Guard main from engineering docs

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  guard-docs:
    uses: brettdavies/.github/.github/workflows/guard-main-docs.yml@main
